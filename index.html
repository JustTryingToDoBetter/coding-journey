<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>6-Month Tech Roadmap</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;700&family=DM+Mono:wght@300;400;500&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#EDF3FF;
  --bg1:#FFFFFF;
  --bg2:#F6F9FF;
  --bg3:#EAF0FF;
  --border:rgba(38,71,148,0.16);
  --border2:rgba(38,71,148,0.28);
  --text:#1A2342;
  --text2:#42517D;
  --text3:#7180A8;
  --shadow:0 16px 36px rgba(22,43,104,0.14);
  --se:#18B97A;
  --ml:#2D8FF8;
  --fs:#FF9F1C;
  --ai:#8868F9;
  --dsa:#EC5D93;
  --prj:#3C966E;
  --read:#67779D;
}
html{scroll-behavior:smooth}
body{
  background:
    radial-gradient(900px 500px at -10% 0%, rgba(128,220,255,0.35), transparent 63%),
    radial-gradient(760px 460px at 105% 8%, rgba(255,166,184,0.32), transparent 60%),
    linear-gradient(180deg,#F7FAFF 0%, #ECF3FF 44%, #F6FBFF 100%);
  color:var(--text);
  font-family:'DM Sans',sans-serif;
  font-size:14px;
  line-height:1.6;
  min-height:100vh;
}
.header{
  padding:2.7rem 2rem 2rem;
  max-width:1180px;
  margin:1.15rem auto 0;
  background:rgba(255,255,255,0.78);
  border:1px solid rgba(255,255,255,0.86);
  box-shadow:var(--shadow);
  border-radius:24px;
  backdrop-filter:blur(8px);
}
.eyebrow{font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--text3);margin-bottom:.75rem}
h1{font-family:'Syne',sans-serif;font-size:clamp(2.2rem,5.2vw,3.8rem);font-weight:700;line-height:1.05;margin-bottom:.8rem;letter-spacing:-.02em}
h1 span{background:linear-gradient(135deg,#20B97D,#2FA9FF 50%,#8D73FF);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--text2);font-size:15px;max-width:760px;line-height:1.75;margin-bottom:1.5rem}
.legend{display:flex;flex-wrap:wrap;gap:8px}
.leg{display:flex;align-items:center;gap:7px;background:rgba(255,255,255,0.76);border:1px solid var(--border);padding:5px 11px 5px 8px;border-radius:999px;box-shadow:0 3px 10px rgba(18,41,105,0.06)}
.legdot{width:9px;height:9px;border-radius:50%;flex-shrink:0}
.leglabel{font-family:'DM Mono',monospace;font-size:10px;color:var(--text2);letter-spacing:.02em}
.nav{
  position:sticky;
  top:0;
  z-index:100;
  margin-top:1.15rem;
  background:rgba(237,244,255,0.74);
  backdrop-filter:blur(10px);
  border-top:1px solid rgba(255,255,255,0.85);
  border-bottom:1px solid var(--border);
}
.nav-inner{max-width:1180px;margin:0 auto;display:flex;overflow-x:auto;gap:.5rem;padding:.74rem 2rem}
.tab{display:flex;align-items:center;gap:8px;padding:.66rem 1rem;cursor:pointer;border:1px solid transparent;border-radius:999px;background:transparent;color:var(--text2);font-family:'DM Mono',monospace;font-size:11px;letter-spacing:.06em;white-space:nowrap;transition:all .2s}
.tab:hover{color:var(--text);border-color:var(--border);background:#FFFFFF}
.tab.active{color:#FFFFFF;background:linear-gradient(135deg,#276DFF,#34BFFF);box-shadow:0 10px 22px rgba(37,100,255,0.29)}
.tab.active .tnum{background:rgba(255,255,255,0.22);color:#FFFFFF}
.tnum{background:var(--bg3);padding:2px 7px;border-radius:999px;font-size:10px;color:var(--text2)}
.rotbar{padding:1rem 2rem .35rem}
.rotbar-inner{max-width:1180px;margin:0 auto;background:rgba(255,255,255,0.7);border:1px solid var(--border);border-radius:16px;padding:.88rem 1rem .92rem;box-shadow:0 8px 20px rgba(20,46,115,0.08)}
.rottitle{font-family:'DM Mono',monospace;font-size:10px;text-transform:uppercase;letter-spacing:.12em;color:var(--text3);margin-bottom:.6rem}
.rotdays{display:flex;gap:6px;flex-wrap:wrap}
.rotday{display:flex;align-items:center;gap:7px;background:#FFFFFF;border:1px solid var(--border);padding:4px 10px;border-radius:999px;font-size:12px}
.rotday-lbl{font-family:'DM Mono',monospace;font-size:10px;color:var(--text3)}
.content{max-width:1180px;margin:0 auto;padding:1.7rem 2rem 2.4rem}
.phase-hdr{margin-bottom:1rem}
.phase-name{font-family:'Syne',sans-serif;font-size:1.62rem;font-weight:700;line-height:1.2;margin-bottom:.3rem;letter-spacing:-.01em}
.phase-meta{font-size:14px;color:var(--text2);line-height:1.7;max-width:860px}
.phase-kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:.75rem;margin:1rem 0 1.25rem}
.kpi{background:rgba(255,255,255,0.8);border:1px solid var(--border);border-radius:14px;padding:.68rem .84rem;box-shadow:0 6px 16px rgba(24,49,120,0.08)}
.klabel{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:2px}
.kval{font-size:1.05rem;font-weight:700;color:var(--text)}
.phase-progress{background:rgba(255,255,255,0.82);border:1px solid var(--border);border-radius:14px;padding:.72rem .86rem;margin:-.35rem 0 1.15rem;box-shadow:0 6px 14px rgba(22,44,109,0.08)}
.phase-progress-head{display:flex;justify-content:space-between;align-items:center;gap:.6rem;margin-bottom:.45rem}
.phase-progress-meta{font-family:'DM Mono',monospace;font-size:11px;color:var(--text2)}
.phase-progress-track{height:11px;background:#DBE6FF;border:1px solid rgba(42,92,220,0.2);border-radius:999px;overflow:hidden}
.phase-progress-fill{height:100%;background:linear-gradient(90deg,#2671FF,#2EB8FF 58%,#26D9B2);border-radius:999px;transition:width .22s ease-out}
.roadmap{position:relative;padding-left:2.6rem;display:grid;gap:.9rem}
.roadmap:before{content:'';position:absolute;left:1rem;top:.4rem;bottom:.4rem;width:3px;background:linear-gradient(180deg,#89B3FF,#74E4CB)}
.wcard{position:relative;background:var(--bg1);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 10px 24px rgba(22,45,109,0.11);transition:transform .2s,border-color .2s,box-shadow .2s}
.wcard::before{content:'';position:absolute;left:-1.88rem;top:1.38rem;width:14px;height:14px;border-radius:50%;background:linear-gradient(145deg,#2D70FF,#34CDFF);border:2px solid #FFFFFF;box-shadow:0 0 0 4px rgba(45,112,255,0.2)}
.wcard:hover{transform:translateY(-2px);border-color:var(--border2);box-shadow:0 16px 30px rgba(18,46,121,0.17)}
.whdr{width:100%;display:flex;align-items:flex-start;justify-content:space-between;padding:1rem 1.2rem;cursor:pointer;user-select:none;gap:1rem;border:none;background:transparent;text-align:left}
.whdr-l{display:flex;flex-direction:column;gap:.2rem;flex:1;min-width:0}
.wmeta{display:flex;align-items:center;gap:.55rem;flex-wrap:wrap}
.wnum{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)}
.wtitle{font-size:1rem;font-weight:700;line-height:1.35;color:var(--text)}
.wfocus{font-size:12px;color:var(--text2);line-height:1.45}
.wdates{font-family:'DM Mono',monospace;font-size:11px;color:var(--text3)}
.wtoggle{font-family:'DM Mono',monospace;font-size:13px;color:var(--text3);transition:transform .2s;flex-shrink:0;padding-top:3px}
.wcard.open .wtoggle{transform:rotate(180deg)}
.dgrid{display:none;padding:0 1.2rem 1.2rem;border-top:1px dashed var(--border);grid-template-columns:repeat(2,minmax(0,1fr));gap:.78rem}
.wcard.open .dgrid{display:grid}
.drow{--track:#2D70FF;background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--track);border-radius:14px;padding:.75rem .8rem;display:flex;flex-direction:column;gap:.53rem}
.dtop{display:flex;flex-wrap:wrap;gap:.42rem;align-items:center}
.daypill{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.11em;color:var(--text3);background:#FFFFFF;border:1px solid var(--border);padding:3px 7px;border-radius:999px}
.trackpill{font-size:11px;font-weight:600;padding:3px 8px;border:1px solid transparent;border-radius:999px;line-height:1.2}
.dhrs{margin-left:auto;font-family:'DM Mono',monospace;font-size:11px;color:var(--text3);background:#FFFFFF;border:1px solid var(--border);padding:3px 7px;border-radius:999px;white-space:nowrap}
.done-toggle{display:inline-flex;align-items:center;gap:6px;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);background:#FFFFFF;border:1px solid var(--border);padding:2px 7px 2px 6px;border-radius:999px}
.done-toggle input{accent-color:var(--track);width:12px;height:12px;cursor:pointer}
.dblock{display:block}
.dblabel{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:3px}
.dact{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px;flex-wrap:wrap;line-height:1.45;color:var(--text)}
.concepts{display:flex;flex-wrap:wrap;gap:5px}
.concept{font-size:11px;padding:3px 8px;border-radius:999px;border:1px solid var(--border);background:#FFFFFF;color:var(--text2);line-height:1.3}
.drow.done{background:#F3FBF7;border-color:rgba(41,152,106,0.28)}
.drow.done .dact{color:#2A7762;text-decoration:line-through;text-decoration-thickness:1px;text-decoration-color:rgba(42,119,98,0.52)}
.drow.done .concept{opacity:.7}
.drow.done .dblabel{color:#558C81}
.pbadge{font-family:'DM Mono',monospace;font-size:10px;padding:2px 7px;border-radius:999px;font-weight:500;white-space:nowrap}
.exam{display:inline-block;background:#FFF0F0;color:#D23B57;border:1px solid #F2A2B2;font-family:'DM Mono',monospace;font-size:10px;padding:2px 7px;border-radius:999px}
.bfm{background:#E9F2FF;color:#285FCA;border:1px solid #BDD4FF}
.bdc{background:#E4F6FF;color:#0F7FAB;border:1px solid #A5DAF0}
.bed{background:#E7FAEF;color:#1E8E5C;border:1px solid #A5E3C0}
.bbd{background:#FFF5E4;color:#AF6F00;border:1px solid #F5D08D}
.bms{background:#ECEFFF;color:#3D58C8;border:1px solid #C4CDF6}
.bfree{background:#F2F7E3;color:#6F861B;border:1px solid #CDE0A1}
.bprj{background:#EAF6EE;color:#2E8A5F;border:1px solid #BFE0CC}
.supp-wrap{margin-top:1.8rem;display:grid;gap:1rem}
.supp-cat{background:var(--bg1);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 8px 22px rgba(26,51,126,0.09)}
.supp-cat-hdr{padding:.95rem 1.1rem;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,#FFFFFF,#F6F9FF)}
.supp-cat-name{font-family:'DM Mono',monospace;font-size:11px;text-transform:uppercase;letter-spacing:.1em}
.supp-items{padding:.95rem 1.1rem;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:.86rem}
.sitem{border:1px solid var(--border);background:var(--bg2);border-radius:12px;padding:.72rem .75rem}
.sname{font-size:13px;color:var(--text);line-height:1.4;font-weight:700}
.sdesc{font-size:11px;color:var(--text2);line-height:1.55;margin-top:3px}
.sauthor{font-size:11px;color:var(--text3);margin-top:1px}
.freetag{display:inline-block;font-size:9px;font-family:'DM Mono',monospace;background:#EAF6CF;color:#5C7D16;border:1px solid #BCD77A;padding:1px 5px;border-radius:999px;vertical-align:middle;margin-left:5px}
.app-shell{display:grid;gap:1rem}
.hero-grid{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(280px,.75fr);gap:1rem;margin-bottom:1rem}
.dashboard-panel,.focus-panel,.filter-panel,.ops-panel,.insight-card,.review-panel,.empty-state{background:rgba(255,255,255,0.82);border:1px solid var(--border);border-radius:18px;box-shadow:0 10px 24px rgba(22,45,109,0.11)}
.dashboard-panel,.filter-panel,.ops-panel,.insight-card,.review-panel,.empty-state{padding:1rem 1.05rem}
.focus-panel{padding:1.05rem;background:linear-gradient(145deg,rgba(255,255,255,0.92),rgba(239,246,255,0.88));overflow:hidden;position:relative}
.focus-panel:after{content:'';position:absolute;inset:auto -25% -40% auto;width:240px;height:240px;background:radial-gradient(circle,rgba(52,191,255,.18),transparent 65%);pointer-events:none}
.panel-title,.summary-kicker,.filter-label{font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--text3)}
.panel-title,.summary-kicker{margin-bottom:.55rem}
.focus-title{font-family:'Syne',sans-serif;font-size:1.35rem;line-height:1.08;margin-bottom:.35rem}
.focus-copy,.insight-copy,.empty-copy{font-size:13px;color:var(--text2);line-height:1.6}
.focus-meta,.mini-meta,.ops-row,.phase-summary,.week-summary,.task-badges,.task-actions,.evidence-links,.review-grid,.filter-toggles,.dashboard-grid,.track-breakdown,.resource-stats{display:flex;flex-wrap:wrap;gap:.55rem}
.focus-meta{margin-top:.85rem}
.stat-chip,.mini-chip,.signal-chip,.milestone-chip,.evidence-chip,.kind-chip,.status-chip,.week-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border-radius:999px;border:1px solid var(--border);background:#FFFFFF;font-family:'DM Mono',monospace;font-size:10px;color:var(--text2)}
.dashboard-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:.75rem}
.metric-card{padding:.85rem .9rem;border-radius:14px;border:1px solid var(--border);background:linear-gradient(180deg,#FFFFFF,#F6FAFF)}
.metric-value{font-size:1.15rem;font-weight:700;color:var(--text);line-height:1.1}
.metric-label{display:block;font-family:'DM Mono',monospace;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--text3);margin-bottom:.22rem}
.metric-sub,.app-note,.helper-text{font-size:11px;color:var(--text2)}
.track-breakdown{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:.65rem;margin-top:.8rem}
.track-card{padding:.72rem .8rem;border:1px solid var(--border);border-radius:14px;background:rgba(246,249,255,0.92)}
.track-card-head{display:flex;justify-content:space-between;gap:.75rem;align-items:center;margin-bottom:.45rem}
.track-name{font-size:12px;font-weight:700}
.track-bar,.summary-bar{height:8px;background:#DFE8FF;border-radius:999px;overflow:hidden}
.track-fill,.summary-fill{height:100%;border-radius:999px}
.summary-fill{background:linear-gradient(90deg,#2671FF,#2EB8FF 58%,#26D9B2)}
.filter-panel,.ops-panel{display:grid;gap:.85rem}
.filter-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem}
.evidence-grid,.review-grid,.task-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
.filter-field{display:grid;gap:.3rem}
.filter-input,.filter-select,.review-input,.review-select,.evidence-input,.evidence-textarea,.status-select{width:100%;border:1px solid var(--border);border-radius:12px;background:#FFFFFF;color:var(--text);font:inherit;padding:.72rem .8rem;outline:none;transition:border-color .2s,box-shadow .2s}
.filter-input:focus,.filter-select:focus,.review-input:focus,.review-select:focus,.evidence-input:focus,.evidence-textarea:focus,.status-select:focus{border-color:rgba(39,109,255,0.45);box-shadow:0 0 0 4px rgba(39,109,255,0.1)}
.filter-toggle{display:inline-flex;align-items:center;gap:.5rem;border:1px solid var(--border);border-radius:999px;background:#FFFFFF;padding:.45rem .75rem;font-size:12px;color:var(--text2);cursor:pointer}
.filter-toggle input{accent-color:#2A75FF}
.ops-row{align-items:center}
.ghost-btn,.primary-btn,.quiet-btn,.link-btn{border:1px solid var(--border);border-radius:999px;background:#FFFFFF;padding:.62rem .9rem;font:inherit;color:var(--text);cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s}
.primary-btn{background:linear-gradient(135deg,#266CFF,#35BDFF);color:#FFFFFF;border-color:transparent;box-shadow:0 10px 20px rgba(37,100,255,0.22)}
.quiet-btn,.link-btn{padding:.42rem .7rem;font-size:12px}
.link-btn{background:transparent}
.ghost-btn:hover,.primary-btn:hover,.quiet-btn:hover,.link-btn:hover{transform:translateY(-1px);border-color:var(--border2)}
.phase-summary{margin:1rem 0}
.phase-summary .insight-card{flex:1 1 240px}
.week-metrics{display:flex;flex-wrap:wrap;gap:.5rem;justify-content:flex-end}
.week-summary{margin:0 1.2rem .95rem;padding-top:.9rem;border-top:1px dashed var(--border)}
.task-card{--track:#2D70FF;background:var(--bg2);border:1px solid var(--border);border-left:4px solid var(--track);border-radius:16px;padding:.85rem;display:grid;gap:.62rem;transition:transform .18s,border-color .18s,box-shadow .18s}
.task-card:hover{transform:translateY(-1px);border-color:var(--border2);box-shadow:0 12px 22px rgba(22,45,109,0.1)}
.task-card.has-evidence{box-shadow:0 10px 24px rgba(43,146,104,0.12);background:linear-gradient(180deg,#FBFFFD,#F4FBF7)}
.task-card.is-milestone{background:linear-gradient(180deg,rgba(255,255,255,0.97),rgba(241,248,255,0.95))}
.task-card[data-status="done"],.task-card[data-status="reviewed"],.task-card[data-status="shipped"]{border-color:rgba(42,119,98,0.28)}
.task-card[data-status="blocked"]{background:linear-gradient(180deg,#FFF9F5,#FFF6EF)}
.task-top{display:flex;flex-wrap:wrap;gap:.42rem;align-items:center}
.task-title{font-size:14px;font-weight:700;line-height:1.45}
.task-copy{font-size:12px;color:var(--text2)}
.kind-chip.project{background:#EAF6EE;color:#2E8A5F;border-color:#BFE0CC}
.kind-chip.theory{background:#F2F7E3;color:#6F861B;border-color:#CDE0A1}
.kind-chip.practice{background:#FFF5E4;color:#AF6F00;border-color:#F5D08D}
.status-select{max-width:170px;padding:.55rem .72rem;background:#FFFFFF}
.status-chip{border-color:transparent}
.status-chip.not_started{background:#EDF2FF;color:#5970A7}
.status-chip.in_progress{background:#EAF6FF;color:#1577A5}
.status-chip.blocked{background:#FFF2E6;color:#B86A00}
.status-chip.done{background:#EAF7EE;color:#1D8355}
.status-chip.shipped{background:#EEF4FF;color:#2D64D9}
.status-chip.reviewed{background:#F2EDFF;color:#6A57CC}
.evidence-panel,.review-panel{display:grid;gap:.7rem}
.evidence-panel{padding:.85rem;border:1px dashed var(--border);border-radius:14px;background:rgba(255,255,255,0.82)}
.evidence-textarea{min-height:86px;resize:vertical}
.review-textarea{min-height:92px;resize:vertical}
.evidence-links a{font-size:12px;color:#245fc7;text-decoration:none}
.evidence-links a:hover{text-decoration:underline}
.empty-state{text-align:center;padding:1.6rem}
.empty-title{font-family:'Syne',sans-serif;font-size:1.3rem;line-height:1.1;margin-bottom:.4rem}
::-webkit-scrollbar{width:5px;height:5px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:#CBD8F8;border-radius:3px}
@media(max-width:980px){
  .hero-grid,.filter-row,.evidence-grid,.review-grid,.task-grid{grid-template-columns:1fr}
  .wcard.open .dgrid{grid-template-columns:1fr}
}
@media(max-width:700px){
  .header{padding:1.7rem 1rem 1.2rem;border-radius:18px;margin-top:.7rem}
  .nav-inner{padding:.68rem 1rem}
  .rotbar{padding:.75rem 1rem .25rem}
  .content{padding:1.05rem}
  .sub{font-size:14px}
  .wdates{display:none}
  .roadmap{padding-left:1.65rem}
  .roadmap:before{left:.45rem}
  .wcard::before{left:-1.26rem}
  .whdr{padding:.9rem .9rem}
  .dgrid{padding:0 .85rem .9rem}
  .week-summary{margin:0 .85rem .85rem}
  .week-metrics{justify-content:flex-start}
  .task-actions{flex-direction:column;align-items:stretch}
  .status-select{max-width:none}
}
</style>
</head>
<body>
  <div id="header-root"></div>
  <div id="nav-root"></div>
  <main class="content" id="main"></main>
  <script type="module" src="./lib/app.js"></script>
</body>
</html>
